[settings]
http_timeout = "120s"
locked = true

[tools]
python = "3.14.5"
"pipx:pre-commit" = "4.6.1"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"github:nextest-rs/nextest" = { version = "0.9.143", version_prefix = "cargo-nextest-" }
"cargo:lychee" = "0.24.2"
"cargo:mdbook" = "0.5.4"

[vars]
all_platforms = "linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,macos-x64,macos-arm64,windows-x64"

[tasks.lock-tool]
description = "Lock one tool for all supported lockfile platforms"
usage = 'arg "<tool>" help="Tool to lock"'
run = [
  "mise install --yes python",
  "MISE_LOCKED=0 mise lock --yes --platform {{vars.all_platforms}} -- ${usage_tool?}",
]
